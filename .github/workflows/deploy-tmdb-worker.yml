name: Deploy TMDB Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-tmdb-worker.yml'

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit Worker files for zero hardcoded secrets
        run: |
          if grep -rnE "TMDB_API_READ_ACCESS_TOKEN\s*=|TMDB_API_KEY\s*=|eyJhbGci" src/ wrangler.toml package.json; then
            echo "ERROR: Potential hardcoded TMDB credential detected in cloudflare-worker files." >&2
            exit 1
          fi

      - name: Run Cloudflare Worker unit tests
        run: npm test

      - name: Validate required Cloudflare & TMDB secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets must be set." >&2
            exit 1
          fi
          if [ -z "$TMDB_API_READ_ACCESS_TOKEN" ] && [ -z "$TMDB_API_KEY" ]; then
            echo "ERROR: TMDB_API_READ_ACCESS_TOKEN (recommended) or TMDB_API_KEY secret must be set." >&2
            exit 1
          fi

      - name: Sync Worker Secrets & Deploy via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          npx --yes wrangler@4 deploy

          if [ -n "$TMDB_API_READ_ACCESS_TOKEN" ]; then
            printf '%s' "$TMDB_API_READ_ACCESS_TOKEN" | npx --yes wrangler@4 secret put TMDB_API_READ_ACCESS_TOKEN >/dev/null
            echo "Synced TMDB_API_READ_ACCESS_TOKEN secret to Cloudflare Worker."
          fi

          if [ -n "$TMDB_API_KEY" ]; then
            printf '%s' "$TMDB_API_KEY" | npx --yes wrangler@4 secret put TMDB_API_KEY >/dev/null
            echo "Synced TMDB_API_KEY secret to Cloudflare Worker."
          fi
