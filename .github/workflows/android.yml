name: Build MIxmedia Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release & Debug Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing in GitHub Repository Secrets." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/mixmedia-release.jks"
          test -s "$RUNNER_TEMP/mixmedia-release.jks"
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/mixmedia-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD or KEY_PASSWORD secret is missing in GitHub Repository Secrets." >&2
            exit 1
          fi
          gradle --no-daemon clean assembleRelease

      - name: Verify APK Signature & Package Output
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          VERSION=${VERSION:-1.1}
          mkdir -p release-output
          cp "$APK" "release-output/MIxmedia-v${VERSION}-release.apk"

      - name: Upload MIxmedia Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIxmedia-Signed-Release
          path: release-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*.apk
          generate_release_notes: true
