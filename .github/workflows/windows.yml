name: Build MediaX Windows Installer (Win 7 - 11+)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Parse and Validate release-info.properties
        id: release_info
        run: |
          $path = "release-info.properties"
          if (-not (Test-Path $path)) {
            throw "ERROR: release-info.properties not found at repository root."
          }
          $props = @{}
          foreach ($raw in Get-Content $path -Encoding UTF8) {
            $line = $raw.Trim()
            if ([string]::IsNullOrWhiteSpace($line) -or $line.StartsWith("#") -or $line.StartsWith("!")) { continue }
            $idx = $line.IndexOf("=")
            if ($idx -lt 1) { continue }
            $k = $line.Substring(0, $idx).Trim()
            $v = $line.Substring($idx + 1).Trim()
            $props[$k] = $v
          }
          $versionName = $props["VERSION_NAME"]
          $versionCode = $props["VERSION_CODE"]
          $releaseTitle = if ($props["RELEASE_TITLE"]) { $props["RELEASE_TITLE"] } else { "MediaX v$versionName" }
          $releaseNotes = $props["RELEASE_NOTES"]

          if ([string]::IsNullOrWhiteSpace($versionName)) {
            throw "ERROR: VERSION_NAME in release-info.properties is empty."
          }
          if (-not ($versionCode -match '^\d+$') -or [int]$versionCode -le 0) {
            throw "ERROR: VERSION_CODE must be a positive integer, got '$versionCode'."
          }

          $numericParts = @($versionName -replace '[^0-9.]', '' -split '\.' | Where-Object { $_ -ne '' })
          while ($numericParts.Count -lt 3) { $numericParts += '0' }
          $verCsv = "$($numericParts[0]),$($numericParts[1]),$($numericParts[2]),$versionCode"

          "version_name=$versionName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version_code=$versionCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version_csv=$verCsv" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_title=$releaseTitle" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_notes<<EOF_RELEASE_NOTES" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$releaseNotes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF_RELEASE_NOTES" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Corretto 11 (for Windows 7 SP1+ jlink Runtime)
        id: java11
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '11'

      - name: Setup Java 17 (for Gradle Build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Audit Client Repo for Zero Hardcoded TMDB Secrets
        run: |
          $hits = Select-String -Path (Get-ChildItem -Path app,core,desktop,gradle,.env.example -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\(build|\.gradle)\\' }) `
            -Pattern 'eyJhbGciOi|TMDB_API_READ_ACCESS_TOKEN=[^M]|TMDB_API_KEY=[^M]' -ErrorAction SilentlyContinue
          if ($hits) {
            $hits | Format-Table Path, LineNumber, Line
            throw "ERROR: Hardcoded TMDB credentials detected in tracked files."
          }

      - name: Run Desktop Unit Tests & Package Desktop JARs
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_PROXY_BASE_URL: ${{ vars.TMDB_PROXY_BASE_URL }}
        run: |
          gradle --no-daemon :core:test :desktop:test :desktop:packageDesktopLibs --max-workers=1
          if ($LASTEXITCODE -ne 0) { throw "Gradle build/test failed with exit code $LASTEXITCODE" }

      - name: Assemble Slim Windows 7+ Java 11 Runtime & Compile MediaX.exe Launcher
        env:
          CORRETTO11_HOME: ${{ steps.java11.outputs.path }}
          VERSION_NAME: ${{ steps.release_info.outputs.version_name }}
          VERSION_CSV: ${{ steps.release_info.outputs.version_csv }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CORRETTO11_HOME) -or -not (Test-Path $env:CORRETTO11_HOME)) {
            throw "CORRETTO11_HOME not found: '$($env:CORRETTO11_HOME)'"
          }

          $stageDir = [System.IO.Path]::GetFullPath((Join-Path $PWD "desktop/build/win-stage"))
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          New-Item -ItemType Directory -Path $stageDir | Out-Null

          # Copy packaged application & dependency JARs
          Copy-Item -Recurse -Force "desktop/build/desktop-dist/lib" (Join-Path $stageDir "lib")

          # Build slim Java 11 runtime compatible with Windows 7 SP1 .. Windows 11+
          $jlink = Join-Path $env:CORRETTO11_HOME "bin\jlink.exe"
          & $jlink `
            --module-path (Join-Path $env:CORRETTO11_HOME "jmods") `
            --add-modules java.base,java.desktop,java.logging,java.naming,java.net.http,java.sql,java.xml,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.charsets `
            --strip-debug `
            --no-header-files `
            --no-man-pages `
            --compress=2 `
            --output (Join-Path $stageDir "runtime")
          if ($LASTEXITCODE -ne 0) { throw "jlink failed with exit code $LASTEXITCODE" }

          # Bundle Microsoft CRT/UCRT runtime DLLs alongside runtime\bin for clean Windows 7 SP1 systems
          $rtBin = Join-Path $stageDir "runtime\bin"
          Get-ChildItem -Path (Join-Path $env:CORRETTO11_HOME "bin") -File |
            Where-Object { $_.Name -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt).*\.dll$' } |
            ForEach-Object { Copy-Item $_.FullName -Destination $rtBin -Force }

          # Discover or install MinGW-w64 (gcc.exe + windres.exe)
          function Find-ToolBin($exeName, $candidates) {
            foreach ($dir in $candidates) {
              if ($dir -and (Test-Path (Join-Path $dir $exeName))) { return $dir }
            }
            $cmd = Get-Command $exeName -ErrorAction SilentlyContinue
            if ($cmd) { return (Split-Path $cmd.Source -Parent) }
            return $null
          }

          $mingwCandidates = @(
            "C:\msys64\mingw64\bin",
            "C:\mingw64\bin",
            "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin",
            "C:\ProgramData\mingw64\mingw64\bin"
          )
          $mingwBin = Find-ToolBin "windres.exe" $mingwCandidates
          if (-not $mingwBin) {
            choco install mingw -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install mingw failed" }
            $mingwBin = Find-ToolBin "windres.exe" $mingwCandidates
          }
          if (-not $mingwBin -or -not (Test-Path (Join-Path $mingwBin "gcc.exe"))) {
            throw "MinGW-w64 gcc.exe / windres.exe not found after installation."
          }
          $env:PATH = "$mingwBin;$env:PATH"

          # Compile Win32 Resource (icon + Win7..Win11+ app.manifest + version info) and Unicode GUI Launcher
          Push-Location "desktop/installer/windows"
          $genHeader = Join-Path $PWD "version_generated.h"
          try {
            $verName = $env:VERSION_NAME
            $verCsv = $env:VERSION_CSV
            $safeVer = $verName.Replace('"', '\"')
            @(
              "#define APP_VER_CSV $verCsv",
              "#define APP_VER_STR `"$safeVer`""
            ) | Out-File -FilePath $genHeader -Encoding ascii

            & windres.exe resource.rc -O coff -DUSE_GENERATED_VERSION_HEADER -o "$stageDir\resource.res"
            if ($LASTEXITCODE -ne 0) { throw "windres failed with exit code $LASTEXITCODE" }

            & gcc.exe -O2 -DUNICODE -D_UNICODE -D_WIN32_WINNT=0x0601 -mwindows -municode -static `
              launcher.c "$stageDir\resource.res" -o "$stageDir\MediaX.exe" -luser32 -lkernel32
            if ($LASTEXITCODE -ne 0) { throw "gcc launcher build failed with exit code $LASTEXITCODE" }
            Remove-Item "$stageDir\resource.res" -Force -ErrorAction SilentlyContinue
          } finally {
            Remove-Item $genHeader -Force -ErrorAction SilentlyContinue
            Pop-Location
          }

      - name: Build Windows Setup Installer (.exe) & Portable Package (.zip)
        env:
          VERSION_NAME: ${{ steps.release_info.outputs.version_name }}
        run: |
          $nsisCandidates = @(
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS"
          )
          $nsisBin = $nsisCandidates | Where-Object { Test-Path (Join-Path $_ "makensis.exe") } | Select-Object -First 1
          if (-not $nsisBin) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) { $nsisBin = Split-Path $cmd.Source -Parent }
          }
          if (-not $nsisBin) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed" }
            $nsisBin = $nsisCandidates | Where-Object { Test-Path (Join-Path $_ "makensis.exe") } | Select-Object -First 1
          }
          if (-not $nsisBin) { throw "makensis.exe not found after NSIS installation." }
          $env:PATH = "$nsisBin;$env:PATH"

          $outDir = [System.IO.Path]::GetFullPath((Join-Path $PWD "release-output-windows"))
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          $verName = $env:VERSION_NAME
          $setupExe = Join-Path $outDir "MediaX-v${verName}-Windows-x64-Setup.exe"
          $portableZip = Join-Path $outDir "MediaX-v${verName}-Windows-x64-Portable.zip"
          $stageDir = [System.IO.Path]::GetFullPath((Join-Path $PWD "desktop/build/win-stage"))

          Push-Location "desktop/installer/windows"
          try {
            & makensis.exe "/DAPP_VERSION=$verName" "/DSTAGE_DIR=$stageDir" "/DOUT_FILE=$setupExe" mediax-installer.nsi
            if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          Compress-Archive -Path "$stageDir\*" -DestinationPath $portableZip -CompressionLevel Optimal -Force

          foreach ($artifact in @($setupExe, $portableZip)) {
            $hash = (Get-FileHash -Path $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $artifact -Leaf)" | Out-File -FilePath "$artifact.sha256" -Encoding ascii
          }

      - name: Upload MediaX Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaX-v${{ steps.release_info.outputs.version_name }}-Windows-x64
          path: release-output-windows/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach Windows Installer to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_info.outputs.release_title }}
          body: ${{ steps.release_info.outputs.release_notes }}
          files: release-output-windows/*
