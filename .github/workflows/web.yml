name: Build MediaX Web App (iOS & Cross-Platform PWA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Parse and Validate release-info.properties
        id: release_info
        run: |
          python3 - << 'PY'
          import os, sys

          path = "release-info.properties"
          if not os.path.isfile(path):
              sys.stderr.write("ERROR: release-info.properties not found.\n")
              sys.exit(1)

          data = {}
          with open(path, "r", encoding="utf-8") as fh:
              for raw in fh:
                  line = raw.strip()
                  if not line or line.startswith("#") or line.startswith("!") or "=" not in line:
                      continue
                  k, v = line.split("=", 1)
                  data[k.strip()] = v.strip()

          version_name = data.get("VERSION_NAME", "")
          version_code = data.get("VERSION_CODE", "")
          release_title = data.get("RELEASE_TITLE", f"MediaX v{version_name}")
          release_notes = data.get("RELEASE_NOTES", "")

          if not version_name or not version_code.isdigit() or int(version_code) <= 0:
              sys.stderr.write("ERROR: Invalid VERSION_NAME or VERSION_CODE in release-info.properties.\n")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version_name={version_name}\n")
              out.write(f"version_code={version_code}\n")
              out.write(f"release_title={release_title}\n")
              out.write("release_notes<<EOF_RELEASE_NOTES\n")
              out.write(f"{release_notes}\n")
              out.write("EOF_RELEASE_NOTES\n")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Audit Client Repo for Zero Hardcoded TMDB Secrets
        run: |
          if grep -rnE --exclude-dir=build --exclude-dir=.gradle "eyJhbGciOi|TMDB_API_READ_ACCESS_TOKEN=[^M]|TMDB_API_KEY=[^M]" app/ core/ desktop/ web/ .env.example gradle/ 2>/dev/null; then
            echo "ERROR: Hardcoded TMDB credentials detected in tracked files." >&2
            exit 1
          fi

      - name: Test & Package MediaX Web App
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_PROXY_BASE_URL: ${{ vars.TMDB_PROXY_BASE_URL }}
        run: |
          gradle --no-daemon :core:test :web:test :web:packageWebApp --max-workers=1

      - name: Assemble Portable Cross-Platform Web Server Bundle & Static PWA Zip
        env:
          VERSION_NAME: ${{ steps.release_info.outputs.version_name }}
        run: |
          STAGE="web/build/web-bundle"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/lib" "release-output-web"
          cp -r web/build/web-dist/lib/* "$STAGE/lib/"

          cat > "$STAGE/start-mediax-web.sh" << 'SH'
          #!/usr/bin/env sh
          set -e
          DIR="$(cd "$(dirname "$0")" && pwd)"
          PORT="${PORT:-8080}"
          export PORT
          exec java -Xms64m -Xmx512m -Dfile.encoding=UTF-8 -cp "$DIR/lib/*" com.example.web.MainKt
          SH
          chmod +x "$STAGE/start-mediax-web.sh"

          cat > "$STAGE/start-mediax-web.bat" << 'BAT'
          @echo off
          setlocal
          set "APP_DIR=%~dp0"
          if "%PORT%"=="" set "PORT=8080"
          java -Xms64m -Xmx512m -Dfile.encoding=UTF-8 -cp "%APP_DIR%lib\*" com.example.web.MainKt
          BAT

          OUT_SERVER="release-output-web/MediaX-v${VERSION_NAME}-WebApp-CrossPlatform.zip"
          OUT_STATIC="release-output-web/MediaX-v${VERSION_NAME}-WebStatic-PWA.zip"
          (cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/$OUT_SERVER" .)
          (cd web/src/main/resources/web && zip -qr "$GITHUB_WORKSPACE/$OUT_STATIC" .)

          sha256sum "$OUT_SERVER" > "${OUT_SERVER}.sha256"
          sha256sum "$OUT_STATIC" > "${OUT_STATIC}.sha256"

      - name: Upload MediaX Web Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaX-v${{ steps.release_info.outputs.version_name }}-WebApp-PWA
          path: release-output-web/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach Web App Bundle to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_info.outputs.release_title }}
          body: ${{ steps.release_info.outputs.release_notes }}
          files: release-output-web/*
